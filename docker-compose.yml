services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: scriptvision-app
    ports:
      - "9002:9002"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    env_file:
      - .env.docker
    command: npm run dev
    depends_on:
      ollama:
        condition: service_healthy
      comfyui:
        condition: service_started

  ollama:
    image: ollama/ollama
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    entrypoint: ["sh", "-c"]
    command: >
      "
        ollama serve &
        sleep 5 &&
        ollama pull hf.co/unsloth/Qwen3-14B-GGUF:Q5_K_M &&
        ollama pull hf.co/unsloth/Qwen3-8B-GGUF:Q4_K_M &&
        echo 'Models downloaded. Ollama is running.' &&
        wait
      "
    healthcheck:
      test: ["CMD-SHELL", "ollama list | grep -q 'hf.co/unsloth/Qwen3-14B-GGUF:Q5_K_M' && ollama list | grep -q 'hf.co/unsloth/Qwen3-8B-GGUF:Q4_K_M'"]
      interval: 10s
      timeout: 5s
      retries: 60

  comfyui:
    build:
      context: ./comfyui
      dockerfile: Dockerfile
    container_name: comfyui
    ports:
      - "8000:8000"
    volumes:
      - comfyui_models:/app/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  ollama_data:
  comfyui_models:
