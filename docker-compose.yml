services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: scriptvision-app
    ports:
      - "9002:9002"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    env_file:
      - .env.docker
    command: npm run dev
    depends_on:
      ollama:
        condition: service_started
      comfyui:
        condition: service_healthy

  ollama:
    image: ollama/ollama
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    entrypoint: ["sh", "-c"]
    command: >
      "
        ollama serve &
        sleep 5;
        until ollama list | grep -q 'hf.co/unsloth/Qwen3-14B-GGUF:Q5_K_M' && ollama list | grep -q 'hf.co/unsloth/Qwen3-8B-GGUF:Q4_K_M'; do
          echo 'Waiting for models to be pulled...';
          ollama pull hf.co/unsloth/Qwen3-14B-GGUF:Q5_K_M || echo 'Failed to pull Qwen3-14B, retrying...';
          ollama pull hf.co/unsloth/Qwen3-8B-GGUF:Q4_K_M || echo 'Failed to pull Qwen3-8B, retrying...';
          sleep 10;
        done;
        echo 'Models are ready. Ollama is running.';
        wait;
      "

  comfyui:
    build:
      context: ./comfyui
      dockerfile: Dockerfile
    container_name: comfyui
    init: true
    ports:
      - "8000:8000"
    volumes:
      - comfyui_models:/app/models
      - ./comfyui/extra-model-paths.yml:/app/extra_model_paths.yml
    environment:
      - HF_TOKEN=${HF_TOKEN}
    entrypoint: ["/app/entrypoint.sh"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  ollama_data:
  comfyui_models:
