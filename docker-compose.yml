version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: scriptvision-app
    ports:
      - "9002:9002"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
      - OLLAMA_URL=${OLLAMA_URL}
    command: npm run dev
