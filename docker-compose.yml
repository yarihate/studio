services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: scriptvision-app
    ports:
      - "9002:9002"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    env_file:
      - .env.docker
    command: npm run dev
    depends_on:
      ollama:
        condition: service_healthy
      comfyui:
        condition: service_started

  ollama:
    image: ollama/ollama
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    entrypoint: ["sh", "-c"]
    command: >
      "
        ollama serve &
        sleep 5 &&
        ollama pull hf.co/unsloth/Qwen3-14B-GGUF:Q5_K_M &&
        ollama pull hf.co/unsloth/Qwen3-8B-GGUF:Q4_K_M &&
        echo 'Models downloaded. Ollama is running.' &&
        wait
      "
    healthcheck:
      test: ["CMD-SHELL", "ollama list | grep -q 'hf.co/unsloth/Qwen3-14B-GGUF:Q5_K_M' && ollama list | grep -q 'hf.co/unsloth/Qwen3-8B-GGUF:Q4_K_M'"]
      interval: 10s
      timeout: 5s
      retries: 60

  comfyui:
    build:
      context: ./comfyui
      dockerfile: Dockerfile
    container_name: comfyui
    init: true
    ports:
      - "8000:8000"
    volumes:
      - comfyui_models:/app/models
      - ./comfyui/extra-model-paths.yml:/app/extra_model_paths.yml
    environment:
      - HF_TOKEN=${HF_TOKEN}
    command: >
      sh -c "
        wget -q -O /app/models/checkpoints/sd_xl_base_1.0.safetensors https://huggingface.co/stabilityai/stable-diffusion-xl-base-1.0/resolve/main/sd_xl_base_1.0.safetensors && \
        wget -q -O /app/models/checkpoints/sd_xl_refiner_1.0.safetensors https://huggingface.co/stabilityai/stable-diffusion-xl-base-1.0/resolve/main/sd_xl_refiner_1.0.safetensors && \
        wget -q -O /app/models/loras/Minute_Sketch_v2_R-16.safetensors 'https://civitai.com/api/download/models/293240?token=${HF_TOKEN}' && \
        wget -q -O /app/models/unet/qwen_image_fp8_e4m3fn.safetensors https://huggingface.co/Comfy-Org/Qwen-Image_ComfyUI/resolve/main/split_files/diffusion_models/qwen_image_fp8_e4m3fn.safetensors && \
        wget -q -O /app/models/text_encoders/qwen_2.5_vl_7b_fp8_scaled.safetensors https://huggingface.co/Comfy-Org/Qwen-Image_ComfyUI/resolve/main/split_files/text_encoders/qwen_2.5_vl_7b_fp8_scaled.safetensors && \
        wget -q -O /app/models/loras/Qwen-Image-Edit-2509-Lightning-4steps-V1.0-bf16.safetensors 'https://huggingface.co/lightx2v/Qwen-Image-Lightning/resolve/main/Qwen-Image-Edit-2509/Qwen-Image-Edit-2509-Lightning-4steps-V1.0-bf16.safetensors?download=true' && \
        wget -q -O /app/models/vae/qwen_image_vae.safetensors https://huggingface.co/Comfy-Org/Qwen-Image_ComfyUI/resolve/main/split_files/vae/qwen_image_vae.safetensors && \
        wget -q -O /app/models/text_encoders/umt5xxl-encoder-q8_0.gguf https://huggingface.co/Comfy-Org/Wan_2.1_ComfyUI_repackaged/resolve/main/split_files/text_encoders/umt5xxl-encoder-q8_0.gguf?download=true && \
        wget -q -O /app/models/unet/Wan2.2-T2V-A14B-LowNoise-Q8_0.gguf https://huggingface.co/kj-nodes/Wan-Video-2.2/resolve/main/Wan2.2-T2V-A14B-LowNoise-Q8_0.gguf?download=true && \
        wget -q -O /app/models/vae/wan_2.1_vae.safetensors https://huggingface.co/Comfy-Org/Wan_2.1_ComfyUI_repackaged/resolve/main/split_files/vae/wan_2.1_vae.safetensors?download=true && \
        wget -q -O /app/models/loras/Wan21_T2V_14B_lightx2v_cfg_step_distill_lora_rank32.safetensors 'https://huggingface.co/kj-nodes/Wan-Video-2.1-Samples-and-workflows/resolve/main/Wan21_T2V_14B_lightx2v_cfg_step_distill_lora_rank32.safetensors?download=true' && \
        python3 main.py --listen --port 8000
      "
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  ollama_data:
  comfyui_models:
